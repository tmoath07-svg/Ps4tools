name: PS4ToolsMobile
options:
  bundleIdPrefix: com.tmoath07
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    INFOPLIST_KEY_CFBundleDisplayName: "PS4 Tools Mobile"
    INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.utilities"
targets:
  PS4ToolsMobile:
    type: application
    platform: iOS
    sources:
      - PS4ToolsMobile/App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tmoath07.ps4toolsmobile
        PRODUCT_NAME: "PS4 Tools Mobile"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
