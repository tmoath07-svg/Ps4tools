name: Convert GTA V mod to PS4
on:
  workflow_dispatch:
    inputs:
      name:
        description: "اسم المجلد (English)"
        required: true
        default: converted
        type: string
      release_tag:
        description: "Release Tag"
        required: false
        default: ""
        type: string
      mode:
        description: "Conversion mode"
        required: true
        default: auto
        type: choice
        options:
          - auto
          - cars
          - map
          - vehicle
          - character
          - files
          - fivem_map
      merge:
        description: "Merge exactly 5 vehicles"
        required: true
        default: false
        type: boolean
      url:
        description: "Direct download URL"
        required: false
        default: ""
        type: string
jobs:
  convert:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            wine \
            wine64 \
            xvfb \
            unzip \
            p7zip-full \
            unrar \
            python3 \
            python3-pip \
            curl \
            file
          python3 -m pip install --break-system-packages \
            pycryptodome watchdog
      - name: Initialize Wine
        run: |
          export WINEDEBUG=-all
          export WINEPREFIX="$HOME/.wine"
          wineboot --init
          sleep 5
      - name: Extract PS4 tool
        run: |
          test -f ps4tool.zip || {
            echo "::error::ps4tool.zip not found"
            exit 1
          }
          unzip -q ps4tool.zip -d ps4tool
          test -f ps4tool/7N-RL_One_IRAQ.py || {
            echo "::error::7N-RL tool not found"
            exit 1
          }
          cp auto_convert.py ps4tool/auto_convert.py
          mkdir -p input out
      - name: Download mod
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
          URL: ${{ inputs.url }}
        run: |
          set -e
          mkdir -p input
          if [ -n "$TAG" ]; then
            gh release download "$TAG" \
              --repo "${GITHUB_REPOSITORY}" \
              --dir input \
              --clobber
          fi
          if [ -n "$URL" ]; then
            curl -L --fail --retry 3 \
              "$URL" \
              -o /tmp/mod_download
          
            filename=$(basename "${URL%%\?*}")
            if [ -z "$filename" ] || [ "$filename" = "/" ]; then
              filename="download"
            fi
            cp /tmp/mod_download "input/$filename"
          fi
          if [ -z "$(find input -type f -print -quit)" ]; then
            echo "::error::No mod files downloaded"
            exit 1
          fi
      - name: Extract archives
        run: |
          set -e
          mkdir -p /tmp/extract
          for pass in 1 2 3; do
            find input -type f -print0 |
            while IFS= read -r -d '' archive; do
              case "${archive,,}" in
                *.zip|*.7z|*.rar)
                  echo "Extracting: $archive"
                  mkdir -p /tmp/extract/current
                  if [[ "${archive,,}" == *.zip ]]; then
                    unzip -oq "$archive" \
                      -d /tmp/extract/current
                  else
                    7z x -y \
                      "-o/tmp/extract/current" \
                      "$archive" || {
                        echo "::warning::Archive extraction failed: $archive"
                        rm -rf /tmp/extract/current
                        continue
                      }
                  fi
                  cp -a /tmp/extract/current/. input/
                  rm -rf /tmp/extract/current
                  rm -f "$archive"
                  ;;
              esac
            done
          done
          echo "Input files:"
          find input -type f | head -100
      - name: Detect and convert
        id: convert
        env:
          NAME: ${{ inputs.name }}
          MODE: ${{ inputs.mode }}
          MERGE: ${{ inputs.merge }}
          TOOL_TIMEOUT: 5400
        run: |
          cd ps4tool
          python3 -m py_compile auto_convert.py
          python3 auto_convert.py \
            ../input \
            "$NAME" \
            "$MODE" \
            ../out \
            --merge "$MERGE"
      - name: Check output
        if: always()
        run: |
          echo "Conversion results:"
          if [ -d out ]; then
            find out -type f -printf '%p (%s bytes)\n'
          fi
          if [ -f out/info.txt ]; then
            echo "Conversion log:"
            cat out/info.txt
          fi
      - name: Upload conversion results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ps4-result
          path: out/
          if-no-files-found: warn
          retention-days: 7
